<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeiterfassung</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main>
    <h1>Zeitix.ch</h1>
    
    <section id="login-section">
      <h2>Anmelden</h2>
      <form id="login-form">
        <label for="login-username">Benutzername:</label>
        <input type="text" id="login-username" required>

        <label for="login-password">Passwort:</label>
        <input type="password" id="login-password" required>

        <button type="submit">Login</button>
      </form>
      <p id="login-error" class="field-error"></p>
    </section>

    <div id="app-shell" style="display:none;">

      <div id="session-box">
        <p class="session-status-line">Status: <span id="app">App startet...</span></p>
        <div class="session-user-line">
          <p class="session-kicker">Angemeldet als</p>
          <p id="current-user-info" class="session-user"></p>
          <button id="logout-button" type="button">Logout</button>
        </div>
      </div>
      
      <section>
        <h2>Zeit-Erfassung</h2>
        <label for="workday-date">Datum:</label>
        <input type="date" id="workday-date">
        
        <div id="workday-summary">
          <p id="workday-total-session-text">Total Session: 0 h</p>
          <p id="workday-open-hours-text">Zu deklarierende Stunden: 0 h</p>
        </div>

        <button id="BtnCreateSession" type="button">Arbeits-Session anlegen</button>
        <button id="BtnCreateActivity" type="button">Aktivität anlegen</button>

        <form id="session-form" class="app-form">
          <label for="session-from">Zeit von:*</label>
          <input type="time" id="session-from">
          <p id="session-from-error" class="field-error"></p>
          <label for="session-to">Zeit bis:*</label>
          <input type="time" id="session-to">
          <p id="session-to-error" class="field-error"></p>
          <div class="form-actions">
            <button id="BtnSaveSession" type="submit"></button>
            <button id="BtnCloseSessionForm" type="button">Abbrechen</button>
          </div>
        </form>

        <form id="activity-form-new" class="app-form">
          <label for="activity-project-select-new">Projekt auswählen:*</label>
          <select id="activity-project-select-new">
            <option value="">-- Bitte wählen --</option>
          </select>
          <p id="activity-project-error-new" class="field-error"></p>
          <label for="activity-duration-hours">Dauer in Stunden:*</label>
          <input type="number" id="activity-duration-hours" min="0.25" step="0.25">
          <p id="activity-duration-error" class="field-error"></p>
          <label for="activity-comment">Bemerkung:</label>
          <input type="text" id="activity-comment">
          <label for="activity-billing-info">Verrechnungsinfo:</label>
          <input type="text" id="activity-billing-info">
          <label for="activity-billable">Verrechenbar</label>
          <input type="checkbox" id="activity-billable">
          <label for="activity-billed">Abgerechnet</label>
          <input type="checkbox" id="activity-billed">
          <label for="activity-created-by" id="activity-created-by-label" style="display:none;">Angelegt von:</label>
          <input type="text" id="activity-created-by" readonly style="display:none;">
          <div class="form-actions">
            <button id="BtnSaveActivityNew" type="submit"></button>
            <button id="BtnCloseActivityFormNew" type="button">Abbrechen</button>
          </div>
        </form>

        <div class="day-lists">
          <div style="flex:1;">
            <h3>Arbeits-Sessions vom Tag</h3>
            <div id="workday-session-items" class="scrollable-list-item"></div>
          </div>

          <div style="flex:1;">
            <h3>Aktivitäten vom Tag</h3>
            <div id="workday-activity-items" class="scrollable-list-item"></div>
          </div>
        </div>

        <div id="workday-open-days" style="margin-top:12px;">
          <h3>Offene Deklaraitonen:</h3>
          <div id="workday-open-days-items" class="scrollable-list-item"></div>
        </div>
      </section>

      <section id="activity-section">
        <h2>Aktiviäten</h2>
        <div id="activitiesList" class="scrollable-list">
          <input type="text" id="searchActivity" placeholder="Aktivitäten suchen">
          <div class="search-filter-group">
            <label class="search-filter-option">
              <input type="checkbox" id="search-activity-project-checkbox" checked>
              Projektname
            </label>
            <label class="search-filter-option">
              <input type="checkbox" id="search-activity-client-checkbox" checked>
              Kundenname
            </label>
            <label class="search-filter-option">
              <input type="checkbox" id="search-activity-date-checkbox" checked>
              Datum
            </label>
            <label class="search-filter-option" id="search-activity-user-option" style="display:none;">
              <input type="checkbox" id="search-activity-user-checkbox">
              Benutzer
            </label>
          </div>
          <div id="activity-items" class="scrollable-list-item"></div>
        </div>
      </section>

      <section id="project-section" data-manager-only="true">
        <h2>Projekte</h2>
        <button id="BtnCreateProject">Neues Projekt anlegen</button>

        <form id="project-form" class="app-form">
          <label for="project-name">Projektname:*</label>
          <input type="text" id="project-name">
          <p id="project-name-error" class="field-error"></p>
            <label for="project-external-reference">Externe Referenz:</label>
          <input type="text" id="project-external-reference">
          <label for="project-client-select">Kunde:*</label>
          <select id="project-client-select">
            <option value="">-- Bitte waehlen --</option>
          </select>
          <p id="project-client-error" class="field-error"></p>
          <label for="project-completed">Abgeschlossen</label>
          <input type="checkbox" id="project-completed">
          <div class="form-actions">
            <button id = "BtnSaveProject" type="submit"></button>
            <button id ="BtnCloseProjectForm" type="button">Abbrechen</button>
          </div>
        </form>

        <div id="projectsList" class="scrollable-list">
          <input type="text" id="searchProject" placeholder="Projekte suchen">
          <div class="search-filter-group">
            <label class="search-filter-option">
              <input type="checkbox" id="search-project-name-checkbox" checked>
              Projektname
            </label>
            <label class="search-filter-option">
              <input type="checkbox" id="search-project-client-checkbox" checked>
              Kundenname
            </label>
            <label class="search-filter-option">
              <input type="checkbox" id="search-project-external-reference-checkbox" checked>
              Externe Referenz
            </label>
            <label class="search-filter-option">
              <input type="checkbox" id="search-project-status-checkbox" checked>
              Status
            </label>
          </div>
          <div id="project-items" class="scrollable-list-item"></div>
        </div>
      </section>

      <section id="client-section" data-manager-only="true">
        <h2>Kunden</h2>
        <button id="BtnCreateClient">Neuer Kunde anlegen</button>

        <form id="client-form" class="app-form">
          <label for="client-name">Kundenname:</label>
          <input type="text" id="client-name">
            <p id="client-name-error" class="field-error"></p>
          <label for="client-address">Kundenadresse:</label>
          <input type="text" id="client-address">
            <p id="client-address-error" class="field-error"></p>
            <label type ="text" for="client-external-reference">Externe Referenz:</label>
            <input type="text" id="client-external-reference">
            <label for="client-active">Aktiv:</label>
            <input type="checkbox" id="client-active" checked>
          <div class="form-actions">
            <button id = "BtnSaveClient" type="submit"></button>
            <button id ="BtnCloseClientForm" type="button">Abbrechen</button>
          </div>
          </form>

        <div id="clientsList" class="scrollable-list">
          <input type="text" id="searchClient" placeholder="Kunden suchen">
          <div class="search-filter-group">
            <label class="search-filter-option">
              <input type="checkbox" id="search-client-name-checkbox" checked>
              Kundenname
            </label>
            <label class="search-filter-option">
              <input type="checkbox" id="search-client-address-checkbox" checked>
              Kundenadresse
            </label>
            <label class="search-filter-option">
              <input type="checkbox" id="search-client-external-reference-checkbox" checked>
              Externe Referenz
            </label>
            <label class="search-filter-option">
              <input type="checkbox" id="search-client-active-checkbox" checked>
              Aktiv
            </label>
          </div>
          <div id="client-items" class="scrollable-list-item"></div>
        </div>
      </section>

      <section>
        <h2>Einstellungen</h2>
        <h3>Standart-Filter</h3>
        <label>Aktuelle Suchfilter Filter-Einstellung speichern: </label> 

        <button id="save-view-button" type="button">Filter speichern</button>
    
        <h3>Design</h3>
        <label for="theme-toggle">Dunkler Modus</label>
        <input type="checkbox" id="theme-toggle">
        <div id="data-management-section" data-manager-only="true">
        <h3>Daten-Management</h3>
        <button id="deleteDatabase">Datenbank löschen</button>
        <button id="createTestData">Testdaten erstellen</button>
      </div>
      </section>

    </div>
  </main>

  <p id="message-box"></p>

  <script type="module" src="./ui/main.js"></script>
</body>
</html>
