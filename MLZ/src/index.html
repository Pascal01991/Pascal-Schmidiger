<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeiterfassung</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main>
    <h1>Zeiterfassung</h1>
    <p id="app">App startet...</p>

    <section id="login-section">
      <h2>Anmelden</h2>
      <form id="login-form">
        <label for="login-username">Benutzername:</label>
        <input type="text" id="login-username" required>

        <label for="login-password">Passwort:</label>
        <input type="password" id="login-password" required>

        <button type="submit">Login</button>
      </form>
      <p id="login-error" class="field-error"></p>
    </section>

    <div id="app-shell" style="display:none;">

    <section>
      <h2>Session</h2>
      <p id="current-user-info"></p>
      <button id="logout-button" type="button">Logout</button>
    </section>

    <section>
      <h2>Zeit buchen</h2>
      <p>Projekt auswaehlen und Stunden erfassen.</p>
      <form id="time-entry-form">
        <label for="project-select">Projekt auswaehlen:</label>
        <select id="project-select" required>
          <option value="">-- Bitte waehlen --</option>
        </select>

        <label for="hours">Stunden:</label>
        <input type="number" id="hours" step="0.5" required>

        <button type="submit">Zeit buchen</button>
      </form>
    </section>

    <section id="project-section" data-manager-only="true">
      <h2>Neues Projekt anlegen</h2>
      <button id="BtnCreateProject">Neues Projekt anlegen</button>
      <form id="project-form" style="display:none;">
        <label for="project-name">Projektname:*</label>
        <input type="text" id="project-name">
        <p id="project-name-error" class="field-error"></p>
          <label for="project-external-reference">Externe Referenz:</label>
        <input type="text" id="project-external-reference">
        <label for="project-client-select">Kunde auswaehlen:*</label>
        <select id="project-client-select">
          <option value="">-- Bitte waehlen --</option>
        </select>
        <p id="project-client-error" class="field-error"></p>
        <input type="checkbox" id="project-completed">
        <label for="project-completed">Abgeschlossen</label>
        <button id = "BtnSaveProject" type="submit"></button>
        <button id ="BtnCloseProjectForm" type="button">Abbrechen</button>
      </form>

      <div id="projectsList" class="scrollable-list">
        <input type="text" id="searchProject" placeholder="Projekte suchen">
        <div class="search-filter-group">
          <label class="search-filter-option">
            <input type="checkbox" id="search-project-name-field" checked>
            Projektname
          </label>
          <label class="search-filter-option">
            <input type="checkbox" id="search-project-client-field" checked>
            Kundenname
          </label>
          <label class="search-filter-option">
            <input type="checkbox" id="search-project-external-reference-field" checked>
            Externe Referenz
          </label>
          <label class="search-filter-option">
            <input type="checkbox" id="search-project-status-field" checked>
            Status
          </label>
        </div>
        <div id="project-items" class="scrollable-list-item"></div>
     
      </div>
    </section>

    <section id="client-section" data-manager-only="true">
      <h2>Neuer Kunde anlegen</h2>
      
      <button id="BtnCreateClient">Neuer Kunde anlegen</button>
      <form id="client-form" style="display:none;">
              <label for="client-name">Kundenname:</label>
              <input type="text" id="client-name">
                <p id="client-name-error" class="field-error"></p>
              <label for="client-address">Kundenadresse:</label>
              <input type="text" id="client-address">
                <p id="client-address-error" class="field-error"></p>
                <label type ="text" for="client-external-reference">Externe Referenz:</label>
                <input type="text" id="client-external-reference">
                <label for="client-active">Aktiv:</label>
                <input type="checkbox" id="client-active" checked>
              <button id = "BtnSaveClient" type="submit"></button>
              <button id ="BtnCloseClientForm" type="button">Abbrechen</button>
            </form>
      <div id="clientsList" class="scrollable-list">
        <input type="text" id="searchClient" placeholder="Kunden suchen">
        <div class="search-filter-group">
          <label class="search-filter-option">
            <input type="checkbox" id="search-client-name-field" checked>
            Kundenname
          </label>
          <label class="search-filter-option">
            <input type="checkbox" id="search-client-address-field" checked>
            Kundenadresse
          </label>
          <label class="search-filter-option">
            <input type="checkbox" id="search-client-external-reference-field" checked>
            Externe Referenz
          </label>
          <label class="search-filter-option">
            <input type="checkbox" id="search-client-active-field" checked>
            Aktiv
          </label>
        </div>
        <div id="client-items" class="scrollable-list-item"></div>
      </div>
    </section>

    <section id="data-management-section" data-manager-only="true">
      <h2>Daten-Management</h2>
      <button id="deleteDatabase">Datenbank löschen</button>
      <button id="createTestData">Testdaten erstellen</button>
    </section>

    <section>
        <p id="message-box" style="display:none;"></p>
    </section>
    </div>
  </main>

  <script type="module" src="./ui/main.js"></script>
</body>
</html>
