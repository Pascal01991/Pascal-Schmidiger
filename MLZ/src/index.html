<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeiterfassung</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main>
    <h1>Zeiterfassung</h1>
    <p id="app">App startet...</p>

    <section>
      <h2>Zeit buchen</h2>
      <p>Projekt auswaehlen und Stunden erfassen.</p>
      <form id="time-entry-form">
        <label for="project-select">Projekt auswaehlen:</label>
        <select id="project-select" required>
          <option value="">-- Bitte waehlen --</option>
        </select>

        <label for="hours">Stunden:</label>
        <input type="number" id="hours" step="0.5" required>

        <button type="submit">Zeit buchen</button>
      </form>
    </section>

    <section>
      <h2>Neues Projekt anlegen</h2>
      <button id="BtnCreateProject">Neues Projekt anlegen</button>
      <form id="project-form" style="display:none;">
        <label for="project-name">Projektname:*</label>
        <input type="text" id="project-name">
        <p id="project-name-error" class="field-error"></p>
        <label for="project-client-select">Kunde auswaehlen:*</label>
        <select id="project-client-select">
          <option value="">-- Bitte waehlen --</option>
        </select>
        <p id="project-client-error" class="field-error"></p>
        <input type="checkbox" id="project-completed">
        <label for="project-completed">Abgeschlossen</label>
        <button id = "BtnSaveProject" type="submit"></button>
        <button id ="BtnCloseProjectForm" type="button">Abbrechen</button>
      </form>

      <div id="projectsList" class="scrollable-list">
        <input type="text" id="searchProject" placeholder="Projekte suchen">
        <!-- Projektliste in einem scrollbaren Container -->
         <!-- TODO: CSS Klasse -->
          <div id="project-items" class="scrollable-list-item"></div>
     
      </div>
    </section>

    <section>
      <h2>Neuer Kunde anlegen</h2>
      <form id="client-form">
        <label for="client-name">Kundenname:</label>
        <input type="text" id="client-name" required minlength="3">
        <label for="client-address">Kundenadresse:</label>
        <input type="text" id="client-address" required>
        <button type="submit">Kunde speichern</button>
      </form>
    </section>

    <section>
      <h2>Daten-Management</h2>
      <button id="deleteDatabase">Datenbank löschen</button>
      <button id="createTestData">Testdaten erstellen</button>
    </section>

    <section>
        <p id="message-box" style="display:none;"></p>
    </section>
  </main>

  <script type="module" src="./ui/main.js"></script>
</body>
</html>
