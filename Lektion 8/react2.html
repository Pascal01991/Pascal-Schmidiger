<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function Zaehler() {
            const [count, setCount] = React.useState(0);

           React.useEffect(() => {
            document.title = `Zähler: ${count}`;
        }, [count]);
 

            const farbe = count > 0 ? 'green' : count < 0 ? 'red' : 'black';
            
            return (
                <div>
                    <h1 style={{ color: farbe }}>Zähler: {count}</h1>
                    <button onClick={() => setCount(count + 1)}>+</button>
                    <button onClick={() => setCount(count - 1)}>-</button>
                    <button onClick={() => setCount(0)}>Zurücksetzen</button>
                </div>
            );

            
        
        }

        ReactDOM.render(<Zaehler />, document.getElementById('root'));
        
    </script>
</body>
</html>
